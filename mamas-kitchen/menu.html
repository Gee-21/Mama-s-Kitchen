<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Menu | Mama's Kitchen Melville</title>
    <meta name="description" content="Breakfast, lunch, dinner and drinks from Mama's Kitchen. Realistic Joburg prices, VAT included.">
    <meta name="theme-color" content="#ff4d00">
    <link rel="canonical" href="https://mamaskitchen.example/menu.html">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body data-page="menu">
    <a class="skip" href="#main">Skip to content</a>
    <header class="header">
      <a class="logo" href="index.html">
        <img src="assets/icons/icon.svg" alt="">
        Mama's Kitchen
      </a>
      <nav class="desktop-nav" aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="menu.html" data-nav="menu">Menu</a>
        <a href="cart.html" data-nav="cart">Cart</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <div class="header__meta"><small>Menu · VAT included</small></div>
      <div class="header__actions">
        <button type="button" class="btn btn--ghost" data-install hidden>Install</button>
        <a class="icon-btn" href="cart.html" aria-label="Open cart">🛒<span class="badge" data-cart-count hidden>0</span></a>
      </div>
    </header>

    <main id="main" class="page wrap">
      <h1 class="page-title">Menu</h1>
      <p class="lede">Breakfast until 11:30. Lunch from 11:00. Dinner from 17:00. Drinks all day.</p>
      <form class="search" role="search" onsubmit="return false">
        <label class="visually-hidden" for="menu-search" style="position:absolute;left:-999px">Filter dishes</label>
        <input id="menu-search" type="search" placeholder="Filter dishes…">
      </form>
      <!-- Sticky category chips -->
      <div id="category-chips" class="chips" role="tablist" aria-label="Categories"></div>
      <div id="menu-grid"></div>
      <noscript>
        <ul>
          <li>Vetkoek stuffed with mince — R48</li>
          <li>Durban beef bunny chow — R92</li>
          <li>Sunday braai platter — R195</li>
          <li>Iced rooibos &amp; lemon — R28</li>
        </ul>
        <p>Call 011 482 0190 to place an order without JavaScript.</p>
      </noscript>
    </main>

    <footer class="footer wrap">
      <p><strong>Mama's Kitchen</strong> · © <span id="year"></span></p>
    </footer>
    <nav class="bottom-nav" aria-label="App">
      <a href="index.html" data-nav="home">🏠<br>Home</a>
      <a href="menu.html" data-nav="menu">🍽️<br>Menu</a>
      <a href="cart.html" data-nav="cart">🛒<br>Cart</a>
      <a href="contact.html" data-nav="contact">📞<br>Contact</a>
    </nav>
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/menu.js" defer></script>
  </body>
</html>
